<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تطبيق قِيَم</title>
    
    <!-- إعدادات تطبيق الويب والأيفون (PWA Profile) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="قِيَم">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/5A3D27/FBF5E5?text=%D9%82%D9%90%D9%8A%D9%8E%D9%85">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogItiq2LfZqNmK2YIg2YLZg9mK2YUiLAogICJzaG9ydF9uYW1lIjogItiq2LfZqNmK2YIiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI0ZCRjVFNSIsCiAgInRoZW1lX2NvbG9yIjogIiNGQkY1RTUiCn0=">

    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap">

    <style>
        :root {
            --bg-color: #FBF5E5;
            --card-bg: #F4E8CE;
            --text-color: #362213;
            --accent-color: #5A3D27;
            --accent-light: #E8D3AE;
            --nav-height: 65px;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            touch-action: manipulation;
        }

        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none;
            transform: translate3d(0, 0, 0) scale(0.98);
            transition: transform 0.25s ease, opacity 0.25s ease;
            background-color: var(--bg-color);
            z-index: 1;
        }

        .page.active {
            opacity: 1; pointer-events: auto;
            transform: translate3d(0, 0, 0) scale(1);
            z-index: 2;
        }

        .btn-action {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(54, 34, 19, 0.15);
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; width: 100%; margin: 8px 0;
            box-shadow: 0 4px 10px rgba(54, 34, 19, 0.05);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.15s ease;
        }

        .btn-action:active {
            background-color: var(--accent-color);
            color: #FFF; transform: scale(0.96);
        }

        .btn-google { background-color: #FFF; color: #000; }
        .btn-apple { background-color: #000; color: #FFF; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 100; display: none; justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-color);
            border-radius: 20px; padding: 25px;
            width: 100%; max-width: 350px;
            border: 2px solid var(--accent-color);
            text-align: center;
        }

        .motto-list { margin: 20px 0; font-size: 1.3rem; font-weight: 700; line-height: 2; }
        .app-logo { font-size: 4.5rem; font-weight: 900; color: var(--text-color); text-align: center; }

        .app-header {
            height: 55px; display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid rgba(54, 34, 19, 0.1); position: relative;
        }

        .home-tabs { display: flex; gap: 20px; font-size: 1.1rem; font-weight: 700; }
        .home-tab { opacity: 0.5; cursor: pointer; padding: 5px 10px; }
        .home-tab.active { opacity: 1; border-bottom: 2px solid var(--text-color); }

        .content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: calc(var(--nav-height) + 15px); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background-color: var(--bg-color); border-top: 1px solid rgba(54, 34, 19, 0.12);
            display: flex; justify-content: space-around; align-items: center; z-index: 10;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 0.75rem; font-weight: 700; gap: 4px; cursor: pointer; width: 20%; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { opacity: 1; transform: scale(1.05); }

        .nav-item.upload-btn { opacity: 1; }
        .nav-item.upload-btn i { background-color: var(--text-color); color: var(--bg-color); padding: 8px 14px; border-radius: 12px; }

        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%; background-color: var(--accent-light);
            display: flex; justify-content: center; align-items: center; font-size: 2.5rem;
            border: 3px solid var(--text-color); margin: 0 auto 10px; object-fit: cover;
        }

        .input-edit {
            background: #FFF; border: 1px solid var(--accent-color); border-radius: 10px;
            padding: 10px; color: var(--text-color); font-size: 0.95rem; text-align: left;
            width: 100%; margin-top: 5px; dir: ltr;
        }

        .settings-card { background-color: var(--card-bg); border-radius: 15px; padding: 15px; margin-top: 15px; }
        .setting-item { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(54, 34, 19, 0.08); }
        .setting-item:last-child { border-bottom: none; }

        .error-msg { color: #d9534f; font-size: 0.8rem; margin-top: 4px; display: none; }
    </style>
</head>
<body>

    <!-- 1. شاشة Splash -->
    <div id="splash-screen" class="page active" style="justify-content: space-between; align-items: center; padding: 60px 20px 40px;">
        <div class="app-logo" style="margin-top: 20%;">قِيَم</div>
        <div style="font-size: 1.1rem; font-weight: 700;">جارِ الدخول..</div>
        <div style="font-size: 1.4rem; font-weight: 900; border-top: 1px solid rgba(54, 34, 19, 0.1); padding-top: 15px; width: 80%; text-align:center;">قِيَمُكَ هِيَ مَبَادِئُك</div>
    </div>

    <!-- 2. شاشة تسجيل الدخول -->
    <div id="auth-screen" class="page" style="justify-content: center; align-items: center; padding: 20px;">
        <div class="app-logo">قِيَم</div>
        <div class="motto-list">
            ١. دينك<br>
            ٢. وطنك<br>
            ٣. أنت
        </div>

        <button class="btn-action btn-google" onclick="loginWithGoogle()">
            <i class="fa-brands fa-google"></i> المتابعة باستخدام Google
        </button>
        <button class="btn-action btn-apple" onclick="loginWithApple()">
            <i class="fa-brands fa-apple"></i> المتابعة باستخدام Apple
        </button>
    </div>

    <!-- 3. نافذة التعهد والالتزام -->
    <div id="pledge-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-bottom: 15px; color: var(--accent-color);">تعهد والتزام</h3>
            <div style="text-align: right; font-size: 0.95rem; line-height: 1.8; margin-bottom: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer;">
                    <input type="checkbox" id="check-age" style="width: 18px; height: 18px;">
                    <span>أتعهد بأن عمري 16 سنة فما فوق.</span>
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="check-music" style="width: 18px; height: 18px;">
                    <span>أتعهد أن لا أفتن أو أضع الموسيقى.</span>
                </label>
            </div>
            <button class="btn-action" onclick="submitPledge()">أقر وأتعهد</button>
        </div>
    </div>

    <!-- 4. شاشة إكمال ملف المستخدم (لأول مرة) -->
    <div id="setup-profile-screen" class="page" style="padding: 20px; overflow-y: auto;">
        <h3 style="text-align: center; margin-bottom: 15px;">إكمال بيانات الحساب</h3>
        
        <div style="text-align: center;" onclick="document.getElementById('setup-avatar-input').click()">
            <div class="profile-avatar" id="setup-avatar-display">
                <i class="fa-solid fa-camera"></i>
            </div>
            <small style="opacity: 0.7;">الصورة الشخصية (اختياري)</small>
            <input type="file" id="setup-avatar-input" accept="image/*" style="display: none;" onchange="loadSetupAvatar(event)">
        </div>

        <div class="settings-card">
            <div class="setting-item" style="width: 100%;">
                <label>اليوزر (إنجليزي، 2-16 حرف):</label>
                <input type="text" id="setup-username" class="input-edit" placeholder="e.g. faris_32" maxlength="16">
                <span id="username-err" class="error-msg"></span>
            </div>

            <div class="setting-item" style="width: 100%;">
                <label>الاسم الظاهر (أقصى حد 16 حرف):</label>
                <input type="text" id="setup-name" class="input-edit" placeholder="مثال: فارس" maxlength="16" style="dir: rtl; text-align: right;">
                <span id="name-err" class="error-msg"></span>
            </div>
        </div>

        <button class="btn-action" onclick="saveNewProfile()" style="margin-top: 20px;">حفظ والبدء</button>
    </div>

    <!-- 5. شاشة التطبيق الرئيسية -->
    <div id="main-app" class="page">
        <div class="app-header">
            <div class="home-tabs" id="home-tabs">
                <span class="home-tab active" onclick="switchHomeTab('for-you', this)">لك</span>
                <span style="opacity:0.3">|</span>
                <span class="home-tab" onclick="switchHomeTab('following', this)">أتابعه</span>
            </div>
            <h4 id="header-title" style="display: none;">الرئيسية</h4>
        </div>

        <div class="content-area">
            <div id="view-home" class="tab-view">
                <div style="background-color: var(--card-bg); border-radius: 15px; height: 70vh; display: flex; justify-content: center; align-items: center;">
                    <i class="fa-solid fa-play" style="font-size: 3rem; opacity: 0.4;"></i>
                </div>
            </div>
            <div id="view-search" class="tab-view" style="display: none;">
                <input type="text" placeholder="بحث..." class="input-edit" style="width: 100%; dir: rtl; text-align: right;">
            </div>
            <div id="view-upload" class="tab-view" style="display: none; text-align: center; padding-top: 50px;">
                <i class="fa-solid fa-camera" style="font-size: 4rem;"></i>
            </div>
            <div id="view-notifications" class="tab-view" style="display: none;">
                <p>لا توجد إشعارات حالياً</p>
            </div>
            <div id="view-profile" class="tab-view" style="display: none; text-align: center;">
                <div class="profile-avatar" id="app-avatar"><i class="fa-solid fa-user"></i></div>
                <h3 id="app-name">فارس</h3>
                <p id="app-username" style="opacity: 0.7;">@_v3223v_</p>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchNav('home', this)"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
            <div class="nav-item" onclick="switchNav('search', this)"><i class="fa-solid fa-magnifying-glass"></i><span>البحث</span></div>
            <div class="nav-item upload-btn" onclick="switchNav('upload', this)"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item" onclick="switchNav('notifications', this)"><i class="fa-solid fa-bell"></i><span>الإشعارات</span></div>
            <div class="nav-item" onclick="switchNav('profile', this)"><i class="fa-solid fa-user"></i><span>حسابي</span></div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAI23gvlRESb1Eivn5xjuq1y9U-pcixYsw",
            authDomain: "fit-app-1c1a8.firebaseapp.com",
            projectId: "fit-app-1c1a8",
            storageBucket: "fit-app-1c1a8.firebasestorage.app",
            messagingSenderId: "70249998607",
            appId: "1:70249998607:web:129b8c7e919eb1152bb67a",
            measurementId: "G-PD6NX9CH5B"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedAvatarBase64 = "";

        // التبديل التلقائي للشاشة
        setTimeout(() => {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    checkUserSetup(user.uid);
                } else {
                    showPage('auth-screen');
                }
            });
        }, 1500);

        // تسجيل قوقل
        window.loginWithGoogle = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(err => alert("خطأ في تسجيل قوقل: " + err.message));
        };

        // تسجيل ابل
        window.loginWithApple = function() {
            const provider = new OAuthProvider('apple.com');
            signInWithPopup(auth, provider).catch(err => alert("خطأ في تسجيل أبل: " + err.message));
        };

        // التحقق من حساب المستخدم وتعهده
        async function checkUserSetup(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if (userDoc.exists() && userDoc.data().username) {
                const data = userDoc.data();
                document.getElementById('app-name').innerText = data.name;
                document.getElementById('app-username').innerText = "@" + data.username;
                if(data.avatar) {
                    document.getElementById('app-avatar').innerHTML = `<img src="${data.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                }
                showPage('main-app');
            } else {
                document.getElementById('pledge-modal').style.display = 'flex';
            }
        }

        // حفظ التعهد والتنقل لشاشة الإعداد
        window.submitPledge = function() {
            const age = document.getElementById('check-age').checked;
            const music = document.getElementById('check-music').checked;

            if (!age || !music) {
                alert("يلزم الإقرار بالتعهدين للمتابعة.");
                return;
            }
            document.getElementById('pledge-modal').style.display = 'none';
            showPage('setup-profile-screen');
        };

        // حفظ ملف المستخدم مع التحقق من شروط اليوزر والاسم
        window.saveNewProfile = async function() {
            const usernameInput = document.getElementById('setup-username').value.trim();
            const nameInput = document.getElementById('setup-name').value.trim();

            const usernameErr = document.getElementById('username-err');
            const nameErr = document.getElementById('name-err');

            usernameErr.style.display = 'none';
            nameErr.style.display = 'none';

            // شروط اسم المستخدم (إنجليزية، 2-16 حرف، رموز مسموحة فقط)
            const usernameRegex = /^[a-zA-Z0-9._-]{2,16}$/;
            if (!usernameRegex.test(usernameInput)) {
                usernameErr.innerText = "اليوزر يجب أن يكون بالإنجليزية (2-16 حرف) بدون مسافات.";
                usernameErr.style.display = 'block';
                return;
            }

            // فحص تكرار اليوزر في قاعدة البيانات
            const q = query(collection(db, "users"), where("username", "==", usernameInput));
            const querySnap = await getDocs(q);
            if (!querySnap.empty) {
                usernameErr.innerText = "اسم المستخدم هذا مأخوذ بالفعل، اختر يوزر آخر.";
                usernameErr.style.display = 'block';
                return;
            }

            // شروط الاسم الظاهر
            if (nameInput.length < 1 || nameInput.length > 16) {
                nameErr.innerText = "الاسم يجب أن لا يتعدى 16 حرفاً.";
                nameErr.style.display = 'block';
                return;
            }

            // حفظ البيانات في Firestore
            const now = new Date();
            await setDoc(doc(db, "users", currentUser.uid), {
                username: usernameInput,
                name: nameInput,
                avatar: selectedAvatarBase64,
                lastUsernameChange: now,
                lastNameChange: now,
                createdAt: now
            });

            checkUserSetup(currentUser.uid);
        };

        window.loadSetupAvatar = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedAvatarBase64 = e.target.result;
                    document.getElementById('setup-avatar-display').innerHTML = `<img src="${selectedAvatarBase64}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        window.switchNav = function(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.tab-view').forEach(view => view.style.display = 'none');
            
            const headerTitle = document.getElementById('header-title');
            const homeTabs = document.getElementById('home-tabs');

            if (tabName === 'home') {
                document.getElementById('view-home').style.display = 'block';
                homeTabs.style.display = 'flex';
                headerTitle.style.display = 'none';
            } else {
                homeTabs.style.display = 'none';
                headerTitle.style.display = 'block';
                document.getElementById('view-' + tabName).style.display = 'block';
                headerTitle.innerText = tabName === 'search' ? 'البحث' : tabName === 'upload' ? 'إنشاء' : tabName === 'notifications' ? 'الإشعارات' : 'حسابي';
            }
        };

        window.switchHomeTab = function(tabType, element) {
            document.querySelectorAll('.home-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        };
    </script>
</body>
</html>
